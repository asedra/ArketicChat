<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>ATTILA AI - Enhanced Function Management System</title>
		<meta name="description" content="AI-powered function orchestration platform with intelligent routing and multi-function execution" />
		
		<!-- Preconnect to external services -->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		
		<!-- Google Fonts -->
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
		
		<!-- Custom CSS Variables -->
		<style>
			:root {
				--font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
				--border-radius: 8px;
				--shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
				--shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
			}
			
			/* Dark mode support */
			@media (prefers-color-scheme: dark) {
				:root {
					--shadow: 0 4px 6px -1px rgb(0 0 0 / 0.3), 0 2px 4px -2px rgb(0 0 0 / 0.3);
					--shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.3), 0 4px 6px -4px rgb(0 0 0 / 0.3);
				}
			}
			
			/* Loading animation */
			.loading-spinner {
				animation: spin 1s linear infinite;
			}
			
			@keyframes spin {
				from { transform: rotate(0deg); }
				to { transform: rotate(360deg); }
			}
			
			/* Smooth transitions */
			* {
				transition: all 0.2s ease-in-out;
			}
			
			/* Custom scrollbar */
			::-webkit-scrollbar {
				width: 8px;
			}
			
			::-webkit-scrollbar-track {
				background: rgb(248 250 252);
			}
			
			::-webkit-scrollbar-thumb {
				background: rgb(203 213 225);
				border-radius: 4px;
			}
			
			::-webkit-scrollbar-thumb:hover {
				background: rgb(148 163 184);
			}
			
			@media (prefers-color-scheme: dark) {
				::-webkit-scrollbar-track {
					background: rgb(15 23 42);
				}
				
				::-webkit-scrollbar-thumb {
					background: rgb(51 65 85);
				}
				
				::-webkit-scrollbar-thumb:hover {
					background: rgb(71 85 105);
				}
			}
		</style>
		
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="min-h-screen bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100" style="font-family: var(--font-family)">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
